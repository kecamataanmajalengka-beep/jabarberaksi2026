.rtable tbody td{padding:8px;border-bottom:1px solid rgba(42,58,78,.4);vertical-align:middle}
.rtable tbody tr:last-child td{border-bottom:none}

.rtable .ind-desc{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.4;font-style:italic}

.btn-secondary{background:transparent;color:var(--fg);font-weight:600;padding:9px 18px;border-radius:10px;border:1px solid var(--border);cursor:pointer;font-size:12px;font-family:'Plus Jakarta Sans',sans-serif;transition:all .2s;display:inline-flex;align-items:center;gap:6px}

.toast-container{position:fixed;top:16px;right:16px;z-index:9999;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 18px;border-radius:10px;font-size:13px;font-weight:500;display:flex;align-items:center;gap:9px;animation:toastIn .4s ease;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:400px}
.toast-success{background:#065F46;border:1px solid #10B981;color:#A7F3D0}
.toast-error{background:#7F1D1D;border:1px solid #EF4444;color:#FECACA}
.toast-info{background:#1E3A5F;border:1px solid #3B82F6;color:#BFDBFE}
.toast-warn{background:#78350F;border:1px solid #F59E0B;color:#FDE68A}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}

.modal-overlay.show .modal-box{transform:scale(1)}

.particle{position:fixed;width:3px;height:3px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:0;opacity:0;animation:floatUp linear infinite}

// Toast
function showToast(msg, type="success"){
  const c=document.getElementById("toastContainer");
  const icons={success:"fa-circle-check",error:"fa-circle-xmark",info:"fa-circle-info",warn:"fa-triangle-exclamation"};
  const t=document.createElement("div");
  t.className=`toast toast-${type}`;
  t.innerHTML=`<i class="fas ${icons[type]}"></i><span>${msg}</span>`;
  c.appendChild(t);
  setTimeout(()=>{t.style.transition="opacity .4s,transform .4s";t.style.opacity="0";t.style.transform="translateX(60px)";setTimeout(()=>t.remove(),400)},4000);
}

// ==================== SATU PINTA UPDATE PERSENTASE ====================
// Fungsi ini menangani semua perubahan persentase (slider, preset, numpad, auto-fill)
// dan memastikan DOM selalu konsisten
function updatePctValue(mid, idx, val) {
  const m = modules.find(x => x.id === mid);
  let numVal = parseInt(val) || 0;
  if (numVal > 100) numVal = 100;
  if (numVal > 0 && numVal < m.pctMin) numVal = m.pctMin;
  formData[mid].indicators[idx].percent = numVal > 0 ? String(numVal) : "";
  renderTab();
}

// Slider background
function updateSliderBg(slider, color) {
  const val = parseInt(slider.value) || 0;
  const min = parseInt(slider.min) || 0;
  const max = parseInt(slider.max) || 100;
  const pct = max > min ? ((val - min) / (max - min)) * 100 : 0;
  slider.style.background = `linear-gradient(to right, ${color} 0%, ${color} ${pct}%, var(--border) ${pct}%, var(--border) 100%)`;
}

// ==================== MODAL NUMPAD ====================
function openPctModal(mid, idx) {
  pctModalState = { mid, idx, value: formData[mid].indicators[idx].percent || "" };
  renderPctModal();
  document.getElementById("pctModal").classList.add("show");
  setTimeout(() => {
    const inp = document.getElementById("pctModalInput");
    if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
  }, 120);
}

function closePctModal() {
  document.getElementById("pctModal").classList.remove("show");
}

  const { mid, idx, value } = pctModalState;
  const m = modules.find(x => x.id === mid);
  const shortTitle = m.indicators[idx].title.length > 40 ? m.indicators[idx].title.substring(0, 40) + "..." : m.indicators[idx].title;

      <button class="pct-numpad-btn" onclick="pctNumpadPress('5')">5</button>
      <button class="pct-numpad-btn" onclick="pctNumpadPress('6')">6</button>
      <button class="pct-numpad-btn" onclick="pctNumpadPress('7')">7</button>
      <button class="pct-numpad-btn" onclick="pctNumpadPress('8')">8</button>
      <button class="pct-numpad-btn" onclick="pctNumpadPress('9')">9</button>
      <button class="pct-numpad-btn danger-btn" onclick="pctNumpadPress('C')"><i class="fas fa-delete-left"></i></button>
      <button class="pct-numpad-btn" onclick="pctNumpadPress('0')">0</button>
      <button class="pct-numpad-btn accent-btn" onclick="pctNumpadPress('OK')"><i class="fas fa-check"></i></button>
    </div>
    <div class="flex gap-2 mt-3">
      <button class="btn-secondary flex-1 justify-center text-xs" onclick="pctQuickSet(${m.pctMin})">${m.pctMin}%</button>
      <button class="btn-secondary flex-1 justify-center text-xs" onclick="pctQuickSet(${Math.round((m.pctMin+m.pctMax)/2)})">${Math.round((m.pctMin+m.pctMax)/2)}%</button>
      <button class="btn-secondary flex-1 justify-center text-xs" onclick="pctQuickSet(${m.pctMax})">${m.pctMax}%</button>
      <button class="btn-secondary flex-1 justify-center text-xs" onclick="pctQuickSet(-1)" style="color:var(--red);border-color:rgba(239,68,68,.3)">Hapus</button>
    </div>
  `;
}

function onPctModalInput(inp) {
  inp.value = inp.value.replace(/[^0-9]/g, "");
  pctModalState.value = inp.value;
  inp.setSelectionRange(inp.value.length, inp.value.length);
}

function onPctModalKey(e) {
  if (e.key === "Enter") { e.preventDefault(); pctNumpadPress("OK"); }
  else if (e.key === "Escape") closePctModal();
}

function pctNumpadPress(key) {
  if (key === "C") {
    pctModalState.value = pctModalState.value.slice(0, -1);
  } else if (key === "OK") {
    pctApplyValue(); return;
  } else {
    if (pctModalState.value.length < 3) pctModalState.value += key;
  }
  const inp = document.getElementById("pctModalInput");
  if (inp) { inp.value = pctModalState.value; inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
}

function pctQuickSet(val) {
  if (val === -1) { pctModalState.value = ""; }
  else { pctModalState.value = String(val); }
  const inp = document.getElementById("pctModalInput");
  if (inp) { inp.value = pctModalState.value; }
  pctApplyValue();
}

function pctApplyValue() {
  const { mid, idx, value } = pctModalState;
  let numVal = parseInt(value) || 0;
  const m = modules.find(x => x.id === mid);
  if (numVal > 100) numVal = 100;
  // Jika di bawah minimum, anggap tidak diisi (kosongkan)
  if (numVal > 0 && numVal < m.pctMin) numVal = m.pctMin;
  formData[mid].indicators[idx].percent = numVal > 0 ? String(numVal) : "";
  closePctModal();
  renderTab();
}

// ==================== PROGRESS RING ====================
function ringSVG(pct,color,sz=52){
  const r=(sz-8)/2,circ=2*Math.PI*r,offset=circ-(Math.max(0,Math.min(100,pct||0))/100)*circ;
  return `<svg width="${sz}" height="${sz}" class="progress-ring"><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke-width="4" class="progress-ring-bg"/><circle cx="${sz/2}" cy="${sz/2}" r="${r}" fill="none" stroke-width="4" stroke="${color}" class="progress-ring-fill" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/><text x="${sz/2}" y="${sz/2}" text-anchor="middle" dominant-baseline="central" fill="${color}" font-size="${sz < 48 ? 9 : 11}" font-weight="800" style="transform:rotate(90deg);transform-origin:center">${pct||0}%</text></svg>`;
}

  if (m.pctMin === 60) return [60, 70, 80, 90, 100];
  if (m.pctMin === 80) return [80, 85, 90, 95, 100];
  return [0, 25, 50, 75, 100];
}

    const isActive = pcStr !== "";
    
    // Warna berdasarkan nilai
    let pctColor = "var(--muted)";
    if (isActive) {
      if (pc >= m.pctMax) pctColor = "var(--green)";
      else if (pc >= m.pctMin) pctColor = m.color;
      else pctColor = "var(--red)";
    }

    const presetBtns = presets.map(v => 
      `<button class="pct-preset ${pcStr === String(v) ? 'active' : ''}" onclick="updatePctValue('${m.id}',${i},${v})">${v}</button>`
    ).join("");

    // Nilai slider: kalau kosong, pakai minimum sebagai posisi awal
    const sliderVal = isActive ? pc : m.pctMin;

    return `<tr>
      <td style="text-align:center;font-weight:700;color:var(--muted);width:35px">${i+1}</td>

        <select class="input-field status-select" onchange="updStatus('${m.id}',${i},this.value)">

        </div>
      </td>
      <td style="width:55px;text-align:center">${isActive ? ringSVG(pc,m.color,46) : '<span style="color:var(--border);font-size:18px">—</span>'}</td>
      <td style="min-width:120px;font-size:11px;color:var(--muted)">${ind.doc||"-"}</td>
    </tr>`;
  }).join("");

  // ==================== STATISTIK YANG DIPERBAIKI ====================
  const total = m.indicators.length;

      <button class="btn-secondary" onclick="printReport()"><i class="fas fa-print"></i> Cetak Laporan</button>
      <button class="btn-secondary" onclick="fillAll('${m.id}')"><i class="fas fa-check-double"></i> Isi Semua Sudah 100%</button>
      <button class="btn-secondary" onclick="resetMod('${m.id}')"><i class="fas fa-rotate-left"></i> Reset</button>
    </div>
  </div>`;

  // Inisialisasi slider background setelah DOM tersedia
  requestAnimationFrame(() => {
    document.querySelectorAll('.pct-slider').forEach(slider => {
      updateSliderBg(slider, m.color);
    });
  });
}

// ==================== UPDATE STATUS (dengan auto-fill persentase) ====================
function updStatus(mid, idx, val) {
  formData[mid].indicators[idx].status = val;
  const m = modules.find(x => x.id === mid);
  
  // Jika status "Sudah" dan persentase masih kosong, auto-fill ke minimum modul
  if (val === "Sudah" && !formData[mid].indicators[idx].percent) {
    formData[mid].indicators[idx].percent = String(m.pctMin);
  }
  // Jika status "Belum", kosongkan persentase
  if (val === "Belum") {
    formData[mid].indicators[idx].percent = "";
  }
  
  renderTab();
}

function updDrive(mid,val){
  formData[mid].driveLink=val;
  const btn=document.getElementById("drvBtn_"+mid);
  if(btn){if(val){btn.href=val;btn.classList.remove("opacity-30","pointer-events-none")}else{btn.href="#";btn.classList.add("opacity-30","pointer-events-none")}}
}

// ==================== UTILITAS ====================
function debounceSDN(){clearTimeout(sdnTimer);sdnTimer=setTimeout(()=>{sdnName=document.getElementById("sdnName").value.trim();localStorage.setItem("jba_sdn",sdnName)},400)}

function fillAll(mid){
  const m = modules.find(x => x.id === mid);
  // ISI STATUS SUDAH + PERSENTASE MAKSIMAL (100%)
  // Ini menjamin semua masuk hitungan "Tercapai"
  formData[mid].indicators.forEach(x => {
    x.status = "Sudah";
    x.percent = String(m.pctMax);
  });
  renderTab();
  showToast("Semua indikator diisi Sudah " + m.pctMax + "%","success");
}

function resetMod(mid){
  const m=modules.find(x=>x.id===mid);
  formData[mid]={indicators:m.indicators.map(()=>({status:"",percent:""})),overview:"",driveLink:""};
  renderTab();showToast("Data modul telah direset","info");
}

    <div class="space-y-3 text-sm" style="color:var(--muted)">
      <p><strong style="color:var(--fg)">PENTING:</strong> Pastikan aturan Firebase Realtime Database sudah diatur. Buka Firebase Console → Realtime Database → Rules, lalu atur seperti ini:</p>
      <pre style="background:var(--bg);padding:12px;border-radius:8px;font-size:11px;overflow-x:auto;color:var(--teal);border:1px solid var(--border)">{
  "rules": {

      "$school": {
        ".read": true,

}</pre>

      <hr style="border-color:var(--border);margin:12px 0">

      <ul style="padding-left:16px;list-style:disc;space-y:3px">
        <li><strong style="color:var(--fg)">Geser slider</strong> — paling cepat untuk menyesuaikan</li>
        <li><strong style="color:var(--fg)">Klik tombol preset</strong> — sekali klik langsung ke nilai (60, 70, 80, dst)</li>
        <li><strong style="color:var(--fg)">Klik angka besar</strong> — muncul numpad untuk input angka spesifik</li>

      <p style="margin-top:8px"><strong style="color:var(--fg)">Statistik:</strong></p>
      <ul style="padding-left:16px;list-style:disc;space-y:2px">

        <li><span style="color:var(--red);font-weight:700">Belum Tercapai</span> = Status Belum, ATAU Sudah tapi persentase di bawah minimum</li>

// ==================== SIMPAN KE FIREBASE ====================
function confirmSave(){
  sdnName=document.getElementById("sdnName").value.trim();
  if(!sdnName){showToast("Masukkan nama SDN terlebih dahulu!","error");document.getElementById("sdnName").focus();return}
  showModal(`<div class="text-center mb-5">
    <div class="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-3" style="background:rgba(212,160,23,.15)">
      <i class="fas fa-cloud-arrow-up text-xl" style="color:var(--accent)"></i>
    </div>
    <h3 class="text-lg font-bold mb-1">Simpan Data?</h3>
    <p class="text-sm" style="color:var(--muted)">Data modul <strong style="color:var(--fg)">${modules[currentTab].label}</strong> untuk <strong style="color:var(--fg)">${sdnName}</strong> akan disimpan ke Firebase.</p>
  </div>
  <div class="flex gap-3">
    <button class="btn-secondary flex-1 justify-center" onclick="closeModal()">Batal</button>
    <button class="btn-primary flex-1 justify-center" onclick="doSave()">Ya, Simpan</button>
  </div>`);
}

function doSave(){
  closeModal();
  const key=sdnName.replace(/[^a-zA-Z0-9_]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
  if(!key){showToast("Nama SDN tidak valid!","error");return}
  const m=modules[currentTab];
  const d=formData[m.id];
  const hasData=d.indicators.some(x=>x.status||x.percent)||d.overview||d.driveLink;
  if(!hasData){showToast("Tidak ada data untuk disimpan!","error");return}

  showToast("Menyimpan data...","info");
  db.ref("schools/"+key+"/"+m.id).set({
    indicators:d.indicators,
    overview:d.overview,
    driveLink:d.driveLink,
    lastUpdated:new Date().toISOString(),
    schoolName:sdnName
  }).then(()=>{
    showToast("Data "+m.label+" berhasil disimpan!","success");
  }).catch(err=>{
    if(String(err).includes("permission_denied")||String(err).includes("PERMISSION_DENIED")){
      showToast("PERMISSION DENIED: Aturan Firebase belum diatur! Buka Panduan untuk cara mengatasi.","error");
      setTimeout(()=>showGuide(),500);
    } else {
      showToast("Gagal menyimpan: "+err.message,"error");
    }
  });
}

// ==================== MUAT DATA ====================
function loadData(){
  sdnName=document.getElementById("sdnName").value.trim();
  if(!sdnName){showToast("Masukkan nama SDN terlebih dahulu!","error");document.getElementById("sdnName").focus();return}
  const key=sdnName.replace(/[^a-zA-Z0-9_]/g,"_").replace(/_+/g,"_").replace(/^_|_$/g,"");
  if(!key){showToast("Nama SDN tidak valid!","error");return}

  showToast("Memuat data "+sdnName+"...","info");
  db.ref("schools/"+key).once("value").then(snapshot=>{
    const data=snapshot.val();
    if(!data){
      showToast("Belum ada data tersimpan untuk "+sdnName,"warn");
      return;
    }
    modules.forEach(m=>{
      if(data[m.id]){
        const saved=data[m.id];
        const inds=saved.indicators||[];
        const newInds=m.indicators.map((_,i)=>{
          if(i<inds.length) return {status:inds[i].status||"",percent:inds[i].percent||""};
          return {status:"",percent:""};
        });
        formData[m.id]={indicators:newInds,overview:saved.overview||"",driveLink:saved.driveLink||""};
      }
    });
    renderTab();
    showToast("Data "+sdnName+" berhasil dimuat!","success");
  }).catch(err=>{
    if(String(err).includes("permission_denied")||String(err).includes("PERMISSION_DENIED")){
      showToast("PERMISSION DENIED: Aturan Firebase belum diatur!","error");
      setTimeout(()=>showGuide(),600);
    } else {
      showToast("Gagal memuat: "+err.message,"error");
    }
  });
}

// ==================== CETAK ====================
function printReport(){
  const m=modules[currentTab];
  const d=formData[m.id];
  const sdn=sdnName||"................................";
  let rows=m.indicators.map((ind,i)=>{
    const st=d.indicators[i].status||"-";
    const pc=d.indicators[i].percent?(d.indicators[i].percent+"%"):"-";
    return `<tr>
      <td style="border:1px solid #999;padding:5px 7px;text-align:center;vertical-align:top">${i+1}</td>
      <td style="border:1px solid #999;padding:5px 7px;vertical-align:top"><strong>${ind.title}</strong>${ind.desc?"<br><em style='font-size:11px;color:#555'>"+ind.desc+"</em>":""}</td>
      <td style="border:1px solid #999;padding:5px 7px;text-align:center;vertical-align:top;font-weight:bold;color:${st==='Sudah'?'green':'red'}">${st}</td>
      <td style="border:1px solid #999;padding:5px 7px;text-align:center;vertical-align:top">${pc}</td>
      <td style="border:1px solid #999;padding:5px 7px;font-size:11px;vertical-align:top;color:#555">${ind.doc||"-"}</td>
    </tr>`;
  }).join("");

  const w=window.open("","_blank");
  w.document.write(`<!DOCTYPE html><html><head><title>Laporan</title>
  <style>body{font-family:'Segoe UI',Arial,sans-serif;padding:25px;color:#111;max-width:950px;margin:auto;font-size:12px}
  h1{font-size:16px;text-align:center;margin-bottom:2px}h2{font-size:12px;text-align:center;font-weight:normal;color:#555;margin-bottom:2px}
  h3{font-size:13px;margin:18px 0 8px;border-bottom:2px solid #D4A017;padding-bottom:4px}
  table{width:100%;border-collapse:collapse;margin-bottom:16px}th{background:#D4A017;color:#000;padding:7px;font-size:11px}
  .info{margin:8px 0}.footer{margin-top:24px;font-size:10px;color:#888;text-align:center;border-top:1px solid #ddd;padding-top:8px}</style></head>
  <body><h1>JABAR BERAKSI 2026</h1><h2>( KerJA BAReng BERgerak MengAKselerasi Sekolah Impian )</h2>
  <p class="info"><strong>SDN :</strong> ${sdn}</p>
  <h3>${m.label}. ${m.title}</h3>
  <table><thead><tr><th style="width:30px">No</th><th>Indikator</th><th style="width:90px;text-align:center">Status</th><th style="width:80px;text-align:center">Prosentase</th><th style="width:140px">Dokumen</th></tr></thead><tbody>${rows}</tbody></table>
  <p class="info"><strong>Gambaran Umum:</strong><br>${d.overview||"-"}</p>
  <p class="info"><strong>Link Google Drive:</strong> ${d.driveLink?'<a href="'+d.driveLink+'" target="_blank">'+d.driveLink+'</a>':"-"}</p>
  <div class="footer">Dicetak: ${new Date().toLocaleDateString("id-ID",{weekday:"long",year:"numeric",month:"long",day:"numeric"})} | JABAR BERAKSI 2026</div>
  <script>window.onload=function(){window.print()}<\/script></body></html>`);
  w.document.close();
}
